name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracker" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://tracker:tracker@localhost:5432/tracker
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Types (mypy)
        run: mypy app
      - name: Security (bandit)
        run: bandit -q -c pyproject.toml -r app
      - name: Migrations apply cleanly
        run: alembic upgrade head
      - name: Tests
        run: coverage run -m pytest -q && coverage report
      - name: Dependency audit
        run: pip-audit --strict || true # advisory; tighten to hard-fail before go-live

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high || true

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep
        run: |
          curl -sLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep
      - name: Build (lint) Bicep
        run: bicep build infra/main.bicep --stdout > /dev/null
      - name: IaC scan (checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: bicep
          soft_fail: true # advisory until the landing zone is deployed
