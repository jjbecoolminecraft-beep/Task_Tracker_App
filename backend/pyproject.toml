[project]
name = "task-tracker-api"
version = "0.1.0"
description = "Enterprise Project & Task Tracker — API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.35",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.9,<3",
    "structlog>=24.4,<26",
    "python-multipart>=0.0.12",
    "redis>=5.2,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.29",
    "coverage[toml]>=7.6,<8",
    "ruff>=0.8,<0.9",
    "black>=24.10,<25",
    "mypy>=1.13,<2",
    "bandit>=1.8,<2",
    "pip-audit>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "S", "ASYNC"]
# S101 (assert) is fine in tests; migrations are generated code.
per-file-ignores = { "tests/**" = ["S101", "S105", "S106"], "migrations/**" = ["E501"] }

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
exclude = ["migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py", "app/main.py"]

[tool.coverage.report]
# Spec §9: >= 80% on the service and authorization layers.
fail_under = 80
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
