# Alembic configuration. The DB URL is injected from app settings in env.py,
# not read from here, so this file carries no credentials.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# After `alembic revision --autogenerate`, run `ruff format migrations/versions`
# and review the diff (autogenerate can propose dropping raw-SQL objects — see
# env.py `_UNMANAGED_OBJECTS`).
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
