# Alembic configuration. The DB URL is injected from app settings in env.py,
# not read from here, so this file carries no credentials.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Format generated migrations: run `ruff format migrations/versions` after
# `alembic revision`. (Configured as an exec hook so it uses the project venv.)
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
